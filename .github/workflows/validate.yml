name: "🔍 validate"

# Pushes to main run these checks through release.yml, which tags only when they pass.
on:
  pull_request:
    paths:
      - "plugins/**"
      - ".claude-plugin/**"
      - "tests/**"
      - "lib/**"
      - ".github/**"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Structure
        run: bash .github/scripts/validate.sh
      - name: ASCII in scripts and contracts
        run: bash .github/scripts/ascii-check.sh
      - name: README inventory is current
        run: bash .github/scripts/inventory.sh --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gawk (cluster.sh time math)
        run: sudo apt-get update && sudo apt-get install -y gawk
      - name: Functional tests (PowerShell backends)
        shell: pwsh
        run: |
          $fail = 0
          foreach ($t in (Get-ChildItem ./tests -Filter *.tests.ps1)) {
            Write-Host "== $($t.Name) =="
            & $t.FullName
            if ($LASTEXITCODE -ne 0) { $fail = 1 }
          }
          exit $fail

  # Windows is the only runner with powershell.exe and Git Bash, so both backends run here.
  contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Contract tests, both backends
        shell: bash
        env:
          RUNES_REQUIRE_PS: "1"
        run: bash .github/scripts/contracts.sh

  # The .sh backends on Linux. macOS (BSD sed/date/stat) is not covered: its runner queue blocked releases.
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Contract tests, .sh backends
        run: bash .github/scripts/contracts.sh

  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the claude CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.300
      - name: claude plugin validate
        run: bash .github/scripts/plugin-validate.sh
