name: "🔍 validate"

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - ".claude-plugin/**"
      - "tests/**"
      - "lib/**"
      - ".github/scripts/validate.sh"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "plugins/**"
      - ".claude-plugin/**"
      - "tests/**"
      - "lib/**"
      - ".github/scripts/validate.sh"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Bash + jq run the structure checks; pwsh (preinstalled on ubuntu)
      # parse-checks the PowerShell rune scripts. The local `runes validate`
      # folds the same checks into runes.ps1 - keep the two in step.
      - name: Structural validation
        run: bash .github/scripts/validate.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gawk (cluster.sh time math)
        run: sudo apt-get update && sudo apt-get install -y gawk
      # FUNCTIONAL tests: run the backend scripts against synthetic fixtures and
      # assert their output contracts (empty scan.tsv, miscounted clusters, dropped
      # coverage - the regressions a structural lint can't see). pwsh is
      # preinstalled on ubuntu; image-find/thumbs degrade off-Windows (no GDI+),
      # but the data-path logic under test still runs.
      - name: Functional tests (PowerShell backends)
        shell: pwsh
        run: |
          $fail = 0
          foreach ($t in (Get-ChildItem ./tests -Filter *.tests.ps1)) {
            Write-Host "== $($t.Name) =="
            & $t.FullName
            if ($LASTEXITCODE -ne 0) { $fail = 1 }
          }
          exit $fail

  # The contract tests run BOTH backends, so they need powershell.exe AND Git Bash
  # together - that pairing only exists on Windows. windows-latest mirrors exactly
  # how they are verified locally (no cross-platform script surgery). This is the
  # canonical doc<->schema<->script<->skill drift guard.
  contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: imageverse contract
        shell: bash
        run: bash plugins/imageverse/contract/contract-test.sh
      - name: clipboard contract
        shell: bash
        run: bash plugins/clipboard/contract/contract-test.sh
