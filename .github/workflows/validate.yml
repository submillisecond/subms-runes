name: "🧪 validate"

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - ".claude-plugin/**"
      - "scripts/validate.ps1"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "plugins/**"
      - ".claude-plugin/**"
      - "scripts/validate.ps1"

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Structural validation
        shell: pwsh
        run: ./scripts/validate.ps1
