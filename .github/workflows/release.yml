name: "🚀 release"

# Releases on every push to main (no manual tags). For each pack, publishes a
# release at the pack's plugin.json version: a version bump creates a new release
# (tag <pack>--vX.Y.Z); pushes that don't bump the version refresh that release's
# zip in place.
on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - ".claude-plugin/**"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate
        shell: pwsh
        run: ./scripts/validate.ps1

      - name: Publish a release per pack at its manifest version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Get-ChildItem plugins -Directory | ForEach-Object {
            $manifest = Join-Path $_.FullName '.claude-plugin/plugin.json'
            if (-not (Test-Path $manifest)) { return }
            $name = $_.Name
            $ver  = (Get-Content $manifest -Raw | ConvertFrom-Json).version
            $tag  = "$name--v$ver"
            $zip  = "$name-$ver.zip"
            Compress-Archive -Path "plugins/$name/*" -DestinationPath $zip -Force
            gh release view $tag *> $null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Refreshing release $tag"
              gh release upload $tag $zip --clobber
            } else {
              Write-Host "Creating release $tag"
              gh release create $tag $zip --title $tag --generate-notes
            }
          }
