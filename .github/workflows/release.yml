name: "🚀 release"

# Releases on every push to main (no manual tags). For each pack, publishes a
# release at the pack's plugin.json version: a version bump creates a new release
# (tag <pack>--vX.Y.Z); pushes that don't bump the version refresh that release's
# zip in place.
on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - ".claude-plugin/**"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate
        shell: pwsh
        run: ./scripts/validate.ps1

      - name: Publish a release per pack at its manifest version
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release-packs.sh
