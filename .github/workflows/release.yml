name: "🚀 release"

# On push to main: run every check, then tag each pack at its plugin.json version.
# A `[release]` commit or a manual run also bumps the minor version first ([skip ci] on the bump commit).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      packs:
        description: "Packs to release (space-separated; blank = all)"
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release (bump + tag + push)
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
        run: bash .github/scripts/release-bump.sh "${{ github.event.inputs.packs }}"

      - name: Tag at current version (no bump)
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[release]')
        run: bash .github/scripts/tag-packs.sh
