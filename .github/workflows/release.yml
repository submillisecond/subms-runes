name: release

on:
  push:
    tags:
      - "*--v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse tag (pack--vX.Y.Z)
        id: tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^(?<pack>.+)--v(?<ver>\d+\.\d+\.\d+)$') { throw "bad tag: $tag" }
          "pack=$($matches.pack)"   | Out-File $env:GITHUB_OUTPUT -Append
          "version=$($matches.ver)" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Validate pack
        shell: pwsh
        run: ./scripts/validate.ps1 ${{ steps.tag.outputs.pack }}

      - name: Assert tag version matches manifest
        shell: pwsh
        run: |
          $pack = "${{ steps.tag.outputs.pack }}"; $ver = "${{ steps.tag.outputs.version }}"
          $man = Get-Content "plugins/$pack/.claude-plugin/plugin.json" -Raw | ConvertFrom-Json
          if ($man.version -ne $ver) { throw "tag v$ver does not match plugin.json v$($man.version)" }

      - name: Package pack
        shell: pwsh
        run: |
          $pack = "${{ steps.tag.outputs.pack }}"; $ver = "${{ steps.tag.outputs.version }}"
          Compress-Archive -Path "plugins/$pack/*" -DestinationPath "$pack-$ver.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ steps.tag.outputs.pack }}-${{ steps.tag.outputs.version }}.zip
