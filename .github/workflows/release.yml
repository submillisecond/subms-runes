name: "🚀 release"

# On every push to main: tag each pack at its plugin.json version (if not already
# tagged). NO commits back to main (your local never falls behind), no Release
# objects/zips/source archives - the tag is the version marker. Bump the version
# locally with `runes release`, which commits + tags before you push.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate
        shell: pwsh
        run: ./scripts/validate.ps1

      - name: Tag each pack at its manifest version
        run: bash .github/scripts/tag-packs.sh
