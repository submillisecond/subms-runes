name: "🚀 release"

# Trigger-based release. On push to main:
#   - if the head commit message contains [release], OR the workflow is run
#     manually (Run workflow), CI BUMPS each pack's version (plugin.json + every
#     skill's frontmatter, in lockstep) + commits ([skip ci]) + tags + pushes.
#   - otherwise it just TAGS each pack at its current plugin.json version (if a
#     version was already bumped locally via `runes release`).
# The [skip ci] on the bump commit prevents a re-trigger loop.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      packs:
        description: "Packs to release (space-separated; blank = all)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate
        run: bash .github/scripts/validate.sh

      - name: Release (bump + tag + push)
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
        run: bash .github/scripts/release-bump.sh "${{ github.event.inputs.packs }}"

      - name: Tag at current version (no bump)
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[release]')
        run: bash .github/scripts/tag-packs.sh
