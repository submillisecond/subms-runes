name: "🚀 release"

# Tags each pack on every push to main (no manual tags). A version bump in a
# pack's plugin.json creates + pushes the tag <pack>--vX.Y.Z; unchanged versions
# are left as-is. No GitHub Release objects, zips, or source-code archives - the
# tag is the version marker; consumers install via the marketplace.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate
        shell: pwsh
        run: ./scripts/validate.ps1

      - name: Tag each pack at its manifest version
        run: bash .github/scripts/tag-packs.sh
