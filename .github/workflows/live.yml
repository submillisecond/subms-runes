name: "📡 live"

# Nightly: packs that call a hosted service check it still serves what their skills name.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Live tests
        run: bash .github/scripts/contracts.sh --live
